<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="cyp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#0b0b10" />
    </linearGradient>

    <!-- Play Button Vibrant Red Gradient -->
    <linearGradient id="cyp-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e56" />
      <stop offset="60%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b20710" />
    </linearGradient>

    <!-- Subtle Cyan Indicator Glow -->
    <linearGradient id="cyp-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="cyp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="6" flood-color="#e50914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Canvas with High Contrast Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cyp-bg)" stroke="#272730" stroke-width="1.5" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Play Triangle with Rounded Join & Vibrant Red Gradient -->
  <path d="M 23 18.5 C 23 17.2 24.4 16.4 25.5 17.1 L 46.2 30.6 C 47.3 31.3 47.3 32.7 46.2 33.4 L 25.5 46.9 C 24.4 47.6 23 46.8 23 45.5 Z"
        fill="url(#cyp-red-grad)"
        filter="url(#cyp-shadow)" />

  <!-- Dual-Engine Status Spark (Top Right Cyan Node) -->
  <circle cx="49" cy="15" r="3.5" fill="url(#cyp-cyan-grad)" />
  <circle cx="49" cy="15" r="1.5" fill="#ffffff" />
</svg>